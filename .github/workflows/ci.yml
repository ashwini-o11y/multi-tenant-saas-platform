name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate application and delivery configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: application/api/requirements.txt

      - name: Install API and test dependencies
        run: python -m pip install -r application/api/requirements.txt

      - name: Run test suite
        run: pytest -q

      - name: Check shell scripts
        run: bash -n scripts/*.sh

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render Kubernetes base and dev overlay
        run: |
          kubectl kustomize kubernetes/base >/dev/null
          kubectl kustomize kubernetes/overlays/dev >/dev/null

      - name: Check whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$GITHUB_BASE_REF...HEAD"
          else
            git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Initialize Terraform without a backend
        run: terraform -chdir=infrastructure/terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=infrastructure/terraform validate

      - name: Build API container
        run: docker build --file application/api/Dockerfile --tag multi-tenant-saas/api:ci-validation application/api

      - name: Set up Go for workflow validation
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
