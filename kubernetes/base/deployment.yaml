apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-tenant-saas-api
  namespace: mt-saas
  labels:
    app: multi-tenant-saas-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-tenant-saas-api
  template:
    metadata:
      labels:
        app: multi-tenant-saas-api
    spec:
      serviceAccountName: multi-tenant-saas-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: multi-tenant-saas/api:REPLACE_WITH_GIT_SHA
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: multi-tenant-saas-api-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
      volumes:
        - name: sqlite-data
          emptyDir: {}
