apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: multi-tenant-saas-api-default-deny
  namespace: mt-saas
spec:
  podSelector:
    matchLabels:
      app: multi-tenant-saas-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mt-saas
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
