services:
  api:
    build:
      context: ./application/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/app.db
      APP_VERSION: "1.0.0"
      DEPLOYMENT_ENVIRONMENT: local
      OTEL_ENABLED: "false"
      OTEL_SERVICE_NAME: multi-tenant-saas-api
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - banking_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  banking_data: