services:
  api:
    build:
      context: ./application/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/app.db
      APP_VERSION: "1.0.0"
      DEPLOYMENT_ENVIRONMENT: local
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: multi-tenant-saas-api
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      OTEL_EXPORTER_OTLP_TIMEOUT: "3000"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - banking_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    environment:
      OTEL_BACKEND_OTLP_ENDPOINT: observability-backend:4317
    volumes:
      - ./kubernetes/observability/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    restart: unless-stopped

  observability-backend:
    image: grafana/otel-lgtm:0.11.11
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "echo > /dev/tcp/127.0.0.1/3000"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  banking_data: